name: Software contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-fixtures:
    name: Asset-free Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select test Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency and record hosted environment
        run: python tools/record_ci_environment.py
      - name: Run contracts using synthetic fixtures
        run: >-
          python -m unittest
          tests.test_live_state
          tests.test_hemline
          tests.test_dataset_partitions
          tests.test_continuation_records
          tests.test_raw_http_records
          tests.test_fabric_evidence_review
          tests.test_geometry_annotation
          tests.test_training_contract
          tests.test_worn_geometry_evaluation
          tests.test_project_assets
          -v

# These tests require neither project images nor model binaries.
# This is not model-quality, training/GPU, browser/camera or Raspberry Pi acceptance.
